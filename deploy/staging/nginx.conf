map $request_uri $contentify_log_uri {
    default $request_uri;
    ~*^/auth/restore/new/ /auth/restore/new/[redacted];
}
map $http_referer $contentify_log_referer {
    default $http_referer;
    ~*/auth/restore/new/ [redacted];
}
map $request_uri $reset_cache_control {
    default "";
    ~*^/auth/restore "no-store";
}
log_format contentify '$remote_addr - $remote_user [$time_local] '
    '"$request_method $contentify_log_uri $server_protocol" $status $body_bytes_sent '
    '"$contentify_log_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    access_log /var/log/nginx/access.log contentify;
    error_log /var/log/nginx/error.log warn;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $reset_cache_control always;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # User-controlled files are always static data. ^~ prevents the generic
    # PHP location from ever handling a file below /uploads.
    location ^~ /uploads/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; sandbox" always;
    }

    # Statische Dateien dürfen nicht in Laravels allgemeine Fehlerseite fallen.
    # So können entfernte Browserbibliotheken auch nicht über eine
    # Anwendungs-Fallbackroute ausgeliefert werden.
    location ~* \.(?:css|js|map|gif|jpe?g|png|svg|webp|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param CONTENTIFY_LOG_URI $contentify_log_uri;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
