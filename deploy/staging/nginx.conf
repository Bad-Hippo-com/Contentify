server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Statische Dateien dürfen nicht in Laravels allgemeine Fehlerseite fallen.
    # So können entfernte Browserbibliotheken auch nicht über eine
    # Anwendungs-Fallbackroute ausgeliefert werden.
    location ~* \.(?:css|js|map|gif|jpe?g|png|svg|webp|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
