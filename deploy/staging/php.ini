display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /var/log/contentify/php/php-error.log
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = Europe/Berlin
expose_php = Off
session.cookie_httponly = On
