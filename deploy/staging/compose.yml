services:
  database:
    image: mariadb:10.11@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: contentify-staging-app:0.18.3
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: app
    restart: unless-stopped
    user: www-data
    env_file: .env.staging
    environment:
      DB_HOST: database
      CONTENTIFY_LOG_ROOT: /var/log/contentify
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - application-storage:/var/www/html/storage
      - public-data:/var/www/html/public
      - /var/log/contentify:/var/log/contentify

  jobs:
    image: contentify-staging-app:0.18.3
    restart: unless-stopped
    user: www-data
    env_file: .env.staging
    environment:
      DB_HOST: database
      CONTENTIFY_LOG_ROOT: /var/log/contentify
      LOG_CHANNEL: jobs
    depends_on:
      database:
        condition: service_healthy
    command:
      - /bin/sh
      - -lc
      - while true; do php artisan jobs >> /var/log/contentify/jobs-runner.log 2>&1; sleep 60; done
    volumes:
      - application-storage:/var/www/html/storage
      - public-data:/var/www/html/public
      - /var/log/contentify:/var/log/contentify

  nginx:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - public-data:/var/www/html/public:ro
      - /var/log/contentify/nginx:/var/log/nginx

volumes:
  database-data:
  application-storage:
  public-data:
